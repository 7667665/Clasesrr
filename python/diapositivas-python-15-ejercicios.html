<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python | 15 ejercicios</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#fff;color:#1b2430}header,footer{height:75px;border-bottom:1px solid #e6e8ec;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}footer{border-top:1px solid #e6e8ec;border-bottom:0}header b{letter-spacing:.08em}header b span{color:#bd273b}main{min-height:calc(100vh - 150px);padding:5vw;max-width:1450px;margin:auto;display:flex;flex-direction:column;justify-content:center}h1{font-size:clamp(28px,4vw,52px);letter-spacing:-.04em;margin:12px 0 36px}.category{color:#ad2840;font-size:13px;text-transform:uppercase;letter-spacing:.1em}.layout{display:grid;grid-template-columns:1.7fr .8fr;gap:5vw;align-items:center}.code{background:#f7f8fa;border:1px solid #e5e8ee;border-radius:14px;overflow:hidden}.bar{padding:12px 22px;border-bottom:1px solid #e5e8ee;font-size:13px;color:#657080;display:flex;justify-content:space-between}pre{margin:0;padding:28px;overflow:auto;line-height:1.85;font-size:clamp(13px,1.25vw,18px);color:#213c58}aside{border-left:3px solid #bc2840;padding-left:22px}aside h2{font-size:26px}aside p{color:#526071;line-height:1.7;font-size:18px}button{cursor:pointer;border:1px solid #dce1e8;border-radius:8px;background:#fff;padding:11px 17px;font-weight:600}button.primary{background:#1b2533;color:white}button:disabled{opacity:.3}@media(max-width:780px){.layout{grid-template-columns:1fr}main{justify-content:flex-start}footer{gap:8px}pre{padding:16px}}</style></head><body><header><b>INTRODUCCIÓN A <span>PYTHON</span></b><span id="count"></span></header><main><div class="category" id="cat"></div><h1 id="title"></h1><div class="layout"><section class="code"><div class="bar"><span>● ● ● &nbsp; ejercicio.py</span><button onclick="copy()">Copiar código</button></div><pre><code id="code"></code></pre></section><aside><small>¿QUÉ DEBEMOS ENTENDER?</small><h2 id="term"></h2><p id="desc"></p></aside></div></main><footer><span>← → navegar · F pantalla completa</span><div><button id="prev" onclick="go(-1)">← Anterior</button> <button class="primary" id="next" onclick="go(1)">Siguiente →</button> <button onclick="full()">⛶</button></div></footer><script>const slides=[["Credencial","nombre = input('Nombre: ')\napellido = input('Apellido: ')\ngrupo = input('Grupo: ')\nprint('=== CREDENCIAL ===')\nprint(f'Nombre: {nombre.upper()} {apellido.upper()}')\nprint(f'Grupo: {grupo}')\nprint('==================')","upper()","Convierte texto a MAYÚSCULAS."],["Usuario institucional","nombre = input('Nombre: ')\nanio = input('Año: ')\nusuario = nombre[:3].lower() + '-' + anio\nprint(f'Usuario: {usuario}')","[:3] y lower()","Obtiene las tres primeras letras y las convierte en minúsculas."],["Etiqueta de archivo","materia = input('Asignatura: ')\nnumero = input('Práctica: ')\narchivo = materia.strip().replace(' ', '_').lower()\nprint(f'{archivo}_practica{numero}.py')","replace()","Reemplaza espacios por guiones bajos."],["Contador de caracteres","frase = input('Frase: ')\nprint(f'Caracteres: {len(frase)}')\nprint(f'Texto limpio: {frase.strip()}')","len() y strip()","len() cuenta caracteres, incluidos espacios; strip() quita espacios exteriores."],["Consumo de agua","vasos = int(input('Número de vasos: '))\nml = vasos * 250\nlitros = ml / 1000\nprint(f'{ml} mL = {litros} L')","int()","Convierte el dato ingresado en un entero."],["Batería disponible","capacidad = float(input('Capacidad mAh: '))\nporcentaje = float(input('Porcentaje: '))\ndisponible = capacidad * porcentaje / 100\nprint(f'Disponible: {disponible:.2f} mAh')","Porcentajes","Se multiplica por el porcentaje y se divide para 100."],["Distancia recorrida","velocidad = float(input('Velocidad km/h: '))\nminutos = float(input('Minutos: '))\nhoras = minutos / 60\ndistancia = velocidad * horas\nprint(f'Distancia: {distancia:.2f} km')","Unidades","Convertimos minutos a horas antes de multiplicar."],["Reparto de entradas","entradas = int(input('Entradas: '))\ngrupos = int(input('Grupos (>0): '))\nprint(f'Por grupo: {entradas // grupos}')\nprint(f'Sobran: {entradas % grupos}')","// y %","// es división entera; % devuelve el residuo."],["Temperatura en Fahrenheit","c = float(input('Grados Celsius: '))\nf = (c * 9 / 5) + 32\nprint(f'{c} °C = {f:.1f} °F')","Fórmula","F = (C × 9 / 5) + 32."],["Indicador de batería","bateria = int(input('Batería (%): '))\nif bateria < 20:\n    print('Batería baja')\nelif bateria < 80:\n    print('Carga suficiente')\nelse:\n    print('Batería alta')","if / elif / else","Evalúa las condiciones en orden y ejecuta una rama."],["Control de temperatura","t = float(input('Temperatura: '))\nif t < 18:\n    print('Frío')\nelif t < 30:\n    print('Normal')\nelse:\n    print('Alerta de calor')","Comparaciones","Menor que 18: frío; de 18 a menos de 30: normal."],["Semáforo peatonal","color = input('Color: ').strip().lower()\nif color == 'rojo':\n    print('Detenerse')\nelif color == 'amarillo':\n    print('Esperar')\nelif color == 'verde':\n    print('Cruzar con precaución')\nelse:\n    print('Color desconocido')","== y lower()","== compara dos valores; lower() normaliza mayúsculas."],["Longitud de contraseña","clave = input('Contraseña: ')\nn = len(clave)\nif n < 8:\n    print('Muy corta')\nelif n < 12:\n    print('Longitud aceptable')\nelse:\n    print('Longitud amplia')\nprint('La longitud no garantiza seguridad')","len() e if","Usamos la cantidad de caracteres para tomar una decisión."],["Estación meteorológica","ciudad = input('Ciudad: ')\nt = float(input('Temperatura: '))\nh = float(input('Humedad: '))\nprint(f'{ciudad}: {t} °C, {h}% de humedad')\nif t > 30:\n    print('Evitar exposición prolongada al calor')\nelse:\n    print('Condiciones térmicas moderadas')","f-strings","{variable} inserta valores dentro del texto."],["Registro de equipaje","nombre = input('Viajero: ')\npeso = float(input('Peso kg: '))\nlimite = float(input('Límite kg: '))\ndiferencia = peso - limite\nprint(f'Viajero: {nombre}')\nif diferencia > 0:\n    print(f'Excede: {diferencia:.2f} kg')\nelse:\n    print(f'Margen: {-diferencia:.2f} kg')","Resta e if","La diferencia positiva indica exceso de peso."]];let i=0;function show(){const s=slides[i];document.getElementById('count').textContent=(i+1)+' / '+slides.length;document.getElementById('cat').textContent=i<4?'Datos, texto y formato':i<9?'Operaciones y fórmulas':i<13?'Decisiones':'Retos integradores';document.getElementById('title').textContent=(i+1)+'. '+s[0];document.getElementById('code').textContent=s[1];document.getElementById('term').textContent=s[2];document.getElementById('desc').textContent=s[3];document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===slides.length-1}function go(n){i=Math.max(0,Math.min(slides.length-1,i+n));show()}function copy(){navigator.clipboard.writeText(slides[i][1])}function full(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key.toLowerCase()==='f')full()});show();</script></body></html>
